<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Sucursales - FEX Pharmacy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js">
    </script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.js"></script>
    <style>
        /* ===== ROOT VARIABLES ===== */
        :root {
            --primary: #1a237e;
            --primary-light: #283593;
            --primary-dark: #0d1445;
            --sidebar-width: 260px;
            --header-height: 64px;
            --radius: 16px;
            --shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);

            /* Light theme (default) */
            --bg-body: #f0f4f9;
            --bg-card: #ffffff;
            --text-primary: #1a2332;
            --text-secondary: #5a6a7e;
            --border-color: #e9ecf0;
            --bg-table-header: #f8fafc;
            --bg-table-hover: #f8fafc;
            --bg-input: #ffffff;
            --bg-sidebar: linear-gradient(180deg, #0d1445 0%, #1a237e 100%);
            --sidebar-text: #ffffff;
            --sidebar-text-muted: rgba(255, 255, 255, 0.7);
            --badge-bg: #e8eaf6;
            --badge-color: var(--primary);
            --modal-bg: #ffffff;
            --modal-header-bg: #ffffff;
            --shadow-color: rgba(0, 0, 0, 0.08);
            --spinner-bg: rgba(0, 0, 0, 0.5);
        }

        /* ===== DARK THEME ===== */
        body.dark-mode {
            --bg-body: #121212;
            --bg-card: #1e1e1e;
            --text-primary: #e8e8e8;
            --text-secondary: #a8a8a8;
            --border-color: #333333;
            --bg-table-header: #2a2a2a;
            --bg-table-hover: #2a2a2a;
            --bg-input: #2a2a2a;
            --bg-sidebar: linear-gradient(180deg, #0a0a1a 0%, #12122a 100%);
            --sidebar-text: #e0e0e0;
            --sidebar-text-muted: rgba(255, 255, 255, 0.6);
            --badge-bg: #2a2a4a;
            --badge-color: #a0a0ff;
            --modal-bg: #1e1e1e;
            --modal-header-bg: #2a2a2a;
            --shadow-color: rgba(0, 0, 0, 0.5);
            --spinner-bg: rgba(0, 0, 0, 0.7);
        }

        /* ===== GLOBAL ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--bg-body);
            color: var(--text-primary);
            overflow-x: hidden;
            transition: background-color 0.35s ease, color 0.35s ease;
        }

        body.theme-ready,
        body.theme-ready * {
            transition: background-color 0.35s ease, color 0.35s ease, border-color 0.35s ease, box-shadow 0.35s ease !important;
        }
        body.theme-ready .fa-spin,
        body.theme-ready .zone-badge,
        body.theme-ready .badge-status {
            transition: none !important;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: var(--border-color);
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb {
            background: #c0c8d4;
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #a0aab8;
        }
        body.dark-mode ::-webkit-scrollbar-track {
            background: #222;
        }
        body.dark-mode ::-webkit-scrollbar-thumb {
            background: #555;
        }
        body.dark-mode ::-webkit-scrollbar-thumb:hover {
            background: #777;
        }

        /* ===== SIDEBAR ===== */
        .sidebar {
            position: fixed;
            top: 0;
            left: 0;
            width: var(--sidebar-width);
            height: 100vh;
            background: var(--bg-sidebar);
            color: var(--sidebar-text);
            z-index: 1050;
            transition: var(--transition);
            overflow-y: auto;
            padding: 0 0 20px 0;
            box-shadow: 4px 0 20px var(--shadow-color);
        }

        .sidebar-brand {
            padding: 20px 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .sidebar-brand i {
            font-size: 28px;
            color: #64ffda;
        }
        .sidebar-brand span {
            font-weight: 700;
            font-size: 18px;
            letter-spacing: -0.5px;
        }
        .sidebar-brand small {
            display: block;
            font-weight: 400;
            font-size: 11px;
            opacity: 0.7;
            letter-spacing: 0.3px;
        }

        .sidebar-menu {
            padding: 16px 12px;
        }
        .sidebar-menu .menu-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 1.2px;
            opacity: 0.5;
            padding: 12px 12px 6px;
            font-weight: 600;
            color: var(--sidebar-text-muted);
        }
        .sidebar-menu .nav-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 11px 16px;
            border-radius: 12px;
            color: var(--sidebar-text-muted);
            text-decoration: none;
            cursor: pointer;
            transition: var(--transition);
            margin-bottom: 2px;
            font-weight: 500;
            font-size: 14px;
            border: none;
            background: none;
            width: 100%;
            text-align: left;
        }
        .sidebar-menu .nav-item:hover {
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
        }
        .sidebar-menu .nav-item.active {
            background: rgba(100, 255, 218, 0.15);
            color: #64ffda;
            box-shadow: 0 0 20px rgba(100, 255, 218, 0.05);
        }
        .sidebar-menu .nav-item i {
            width: 22px;
            font-size: 18px;
            text-align: center;
            flex-shrink: 0;
        }
        .sidebar-menu .nav-item .badge {
            margin-left: auto;
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            font-size: 10px;
            padding: 2px 10px;
            border-radius: 20px;
        }

        /* ===== MAIN CONTENT ===== */
        .main-content {
            margin-left: var(--sidebar-width);
            min-height: 100vh;
            padding: 0;
            transition: var(--transition);
        }

        /* ===== HEADER ===== */
        .top-header {
            background: var(--bg-card);
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 1040;
            backdrop-filter: blur(8px);
            background: var(--bg-card);
            min-height: var(--header-height);
            transition: background 0.3s;
        }
        .top-header .page-title h4 {
            font-weight: 700;
            font-size: 20px;
            margin: 0;
            color: var(--text-primary);
        }
        .top-header .page-title p {
            font-size: 13px;
            color: var(--text-secondary);
            margin: 0;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .header-actions .btn-icon {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            background: var(--bg-card);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            transition: var(--transition);
            cursor: pointer;
            position: relative;
        }
        .header-actions .btn-icon:hover {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }
        .header-actions .btn-icon .notif-dot {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 8px;
            height: 8px;
            background: #f44336;
            border-radius: 50%;
            border: 2px solid #fff;
        }
        .mobile-toggle {
            display: none;
            background: none;
            border: none;
            font-size: 24px;
            color: var(--text-primary);
            cursor: pointer;
            padding: 4px 8px;
        }

        .theme-toggle {
            background: none;
            border: 1px solid var(--border-color);
            border-radius: 30px;
            padding: 6px 12px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            color: var(--text-primary);
            cursor: pointer;
            transition: var(--transition);
            background: var(--bg-card);
        }
        .theme-toggle:hover {
            background: var(--primary);
            color: #fff;
            border-color: var(--primary);
        }

        /* ===== CONTENT BODY ===== */
        .content-body {
            padding: 28px 32px 40px;
        }

        /* ===== CARDS ===== */
        .stat-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            padding: 20px 24px;
            box-shadow: var(--shadow);
            transition: var(--transition);
            border: 1px solid var(--border-color);
            height: 100%;
        }
        .stat-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 40px var(--shadow-color);
        }
        .stat-card .stat-icon {
            width: 48px;
            height: 48px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            margin-bottom: 12px;
        }
        .stat-card .stat-label {
            font-size: 13px;
            color: var(--text-secondary);
            font-weight: 500;
            margin-bottom: 4px;
        }
        .stat-card .stat-value {
            font-size: 28px;
            font-weight: 700;
            color: var(--text-primary);
            letter-spacing: -0.5px;
        }
        .stat-card .stat-change {
            font-size: 12px;
            font-weight: 600;
            padding: 2px 10px;
            border-radius: 20px;
            display: inline-block;
            margin-top: 4px;
        }
        .stat-card .stat-change.up {
            color: #2e7d32;
            background: #e8f5e9;
        }
        .stat-card .stat-change.down {
            color: #c62828;
            background: #ffebee;
        }

        .stat-icon-indigo { background: #e8eaf6; color: var(--primary); }
        .stat-icon-green  { background: #e8f5e9; color: #2e7d32; }
        .stat-icon-red    { background: #ffebee; color: #c62828; }
        .stat-icon-orange { background: #fff3e0; color: #e65100; }
        body.dark-mode .stat-icon-indigo { background: #23264a; color: #a0a0ff; }
        body.dark-mode .stat-icon-green  { background: #1e3a1e; color: #81c784; }
        body.dark-mode .stat-icon-red    { background: #3a1e1e; color: #ef9a9a; }
        body.dark-mode .stat-icon-orange { background: #3a2a1e; color: #ffb74d; }

        body.dark-mode .stat-card .stat-change.up {
            background: #1e3a1e;
            color: #81c784;
        }
        body.dark-mode .stat-card .stat-change.down {
            background: #3a1e1e;
            color: #ef9a9a;
        }

        /* ===== TABLE CONTAINER ===== */
        .table-container {
            background: var(--bg-card);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            padding: 0;
            overflow: hidden;
            border: 1px solid var(--border-color);
            transition: background 0.3s, border 0.3s;
        }

        .table-header {
            padding: 18px 24px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        .table-header h5 {
            font-weight: 700;
            font-size: 16px;
            margin: 0;
            color: var(--text-primary);
        }

        .table-wrapper {
            overflow-x: auto;
            overflow-y: auto;
            max-height: calc(100vh - 320px);
            min-height: 180px;
            padding: 0;
            transition: max-height 0.3s;
        }
        @media (max-width: 768px) {
            .table-wrapper {
                max-height: calc(100vh - 260px);
                min-height: 160px;
            }
        }
        .table-wrapper-branches {
            max-height: calc(100vh - 260px) !important;
        }
        @media (max-width: 768px) {
            .table-wrapper-branches {
                max-height: calc(100vh - 300px) !important;
            }
        }

        .table-wrapper table {
            width: 100%;
            min-width: 0;
            table-layout: auto;
            margin: 0;
            font-size: 13px;
            border-collapse: collapse;
        }
        .table-wrapper table th,
        .table-wrapper table td {
            white-space: nowrap;
            padding: 10px 14px;
            vertical-align: middle;
        }
        .table-wrapper table thead th {
            background: var(--bg-table-header);
            font-weight: 600;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            border-bottom: 2px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 10;
            cursor: pointer;
            user-select: none;
        }
        .table-wrapper table thead th:hover {
            background: var(--bg-table-hover);
        }
        .table-wrapper table thead th .sort-icon {
            margin-left: 4px;
            font-size: 10px;
            opacity: 0.5;
        }
        .table-wrapper table tbody td {
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
        }
        .table-wrapper table tbody tr:hover {
            background: var(--bg-table-hover);
            cursor: pointer;
        }
        .table-wrapper table tbody tr.closed-row {
            opacity: 0.6;
            background: var(--bg-table-hover);
        }
        .table-wrapper table tbody tr.closed-row td {
            text-decoration: line-through;
            text-decoration-color: var(--text-secondary);
        }

        .table-wrapper table td.col-db {
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .col-actions-sticky {
            position: sticky;
            left: 0;
            z-index: 2;
            background: var(--bg-card);
            box-shadow: 2px 0 4px rgba(0,0,0,0.06);
            white-space: nowrap;
        }
        thead .col-actions-sticky {
            z-index: 3;
            background: var(--bg-table-hover);
        }
        tr.closed-row .col-actions-sticky {
            background: var(--bg-table-hover, var(--bg-card));
        }

        /* ===== BADGES ===== */
        .badge-status {
            font-size: 11px;
            padding: 4px 12px;
            border-radius: 20px;
            font-weight: 600;
        }
        .badge-status.active {
            background: #e8f5e9;
            color: #2e7d32;
        }
        .badge-status.closed {
            background: #ffebee;
            color: #c62828;
        }
        .badge-status.si {
            background: #e8f5e9;
            color: #2e7d32;
        }
        .badge-status.no {
            background: #ffebee;
            color: #c62828;
        }
        .badge-status.na {
            background: #f5f5f5;
            color: #999;
        }
        .badge-status.solicitado {
            background: #fff3e0;
            color: #e65100;
        }
        .badge-status.warning {
            background: #fff9c4;
            color: #f57f17;
        }
        body.dark-mode .badge-status.active {
            background: #1e3a1e;
            color: #81c784;
        }
        body.dark-mode .badge-status.closed {
            background: #3a1e1e;
            color: #ef9a9a;
        }
        body.dark-mode .badge-status.si {
            background: #1e3a1e;
            color: #81c784;
        }
        body.dark-mode .badge-status.no {
            background: #3a1e1e;
            color: #ef9a9a;
        }
        body.dark-mode .badge-status.na {
            background: #2a2a2a;
            color: #aaa;
        }
        body.dark-mode .badge-status.solicitado {
            background: #3a2a1e;
            color: #ffb74d;
        }
        body.dark-mode .badge-status.warning {
            background: #3a3a1e;
            color: #ffd54f;
        }

        .zone-badge {
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            color: #fff;
            display: inline-block;
        }

        .btn-actions {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }
        .btn-actions .btn-sm {
            padding: 4px 10px;
            font-size: 11px;
            border-radius: 8px;
        }

        /* ===== MODAL ===== */
        .modal-content {
            border-radius: var(--radius);
            border: none;
            box-shadow: 0 24px 80px var(--shadow-color);
            background: var(--modal-bg);
            color: var(--text-primary);
        }
        .modal-header {
            border-bottom: 1px solid var(--border-color);
            padding: 20px 24px;
            background: var(--modal-header-bg);
            border-radius: var(--radius) var(--radius) 0 0;
        }
        .modal-header .modal-title {
            font-weight: 700;
            font-size: 18px;
            color: var(--text-primary);
        }
        .modal-body {
            padding: 24px;
            max-height: 70vh;
            overflow-y: auto;
        }
        .modal-footer {
            border-top: 1px solid var(--border-color);
            padding: 16px 24px;
            background: var(--modal-header-bg);
            border-radius: 0 0 var(--radius) var(--radius);
        }
        .form-label {
            font-weight: 600;
            font-size: 13px;
            color: var(--text-secondary);
        }
        .form-control, .form-select {
            border-radius: 10px;
            border: 1px solid var(--border-color);
            padding: 10px 14px;
            font-size: 14px;
            transition: var(--transition);
            background: var(--bg-input);
            color: var(--text-primary);
        }
        .form-control:focus, .form-select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(26, 35, 126, 0.10);
            background: var(--bg-input);
            color: var(--text-primary);
        }
        body.dark-mode .form-select option {
            background-color: #2a2a2a;
            color: #eee;
        }
        .form-control-sm {
            padding: 6px 12px;
            font-size: 13px;
        }

        /* ===== COLOR PICKER ===== */
        .color-picker-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 4px;
        }
        .color-picker-group .color-option {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            border: 3px solid transparent;
            cursor: pointer;
            transition: var(--transition);
        }
        .color-picker-group .color-option:hover {
            transform: scale(1.1);
        }
        .color-picker-group .color-option.selected {
            border-color: var(--primary-dark);
            box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--primary-dark);
        }

        /* ===== CHARTS ===== */
        .chart-container {
            position: relative;
            height: 280px;
        }

        /* ===== TOAST ===== */
        .notification-toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 9999;
            max-width: 420px;
            width: 100%;
            background: var(--bg-card);
            border-radius: var(--radius);
            box-shadow: 0 16px 48px var(--shadow-color);
            padding: 16px 20px;
            border-left: 4px solid var(--primary);
            transform: translateX(120%);
            transition: var(--transition);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
        }
        .notification-toast.show {
            transform: translateX(0);
        }
        .notification-toast .notif-title {
            font-weight: 700;
            font-size: 14px;
        }
        .notification-toast .notif-body {
            font-size: 13px;
            color: var(--text-secondary);
            margin: 4px 0 0;
        }
        .notification-toast.toast-success { border-left-color: #2e7d32; }
        .notification-toast.toast-error { border-left-color: #c62828; }
        .notification-toast.toast-warning { border-left-color: #e65100; }
        .notification-toast.toast-info { border-left-color: var(--primary); }

        /* ===== SPINNER OVERLAY ===== */
        .spinner-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--spinner-bg);
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            gap: 16px;
            backdrop-filter: blur(2px);
            transition: opacity 0.3s;
        }
        .spinner-overlay.d-none {
            display: none !important;
        }
        .spinner-overlay .spinner-text {
            color: #fff;
            font-size: 14px;
            font-weight: 500;
            text-shadow: 0 2px 4px rgba(0,0,0,0.3);
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 992px) {
            .sidebar {
                transform: translateX(-100%);
                width: 280px;
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .main-content {
                margin-left: 0;
            }
            .mobile-toggle {
                display: block;
            }
            .content-body {
                padding: 16px;
            }
            .top-header {
                padding: 12px 16px;
            }
        }
        @media (max-width: 576px) {
            .stat-card .stat-value {
                font-size: 22px;
            }
            .table-header {
                flex-direction: column;
                align-items: stretch;
            }
            .header-actions .btn-icon span {
                display: none;
            }
            .modal-body {
                padding: 16px;
            }
            .theme-toggle span {
                display: none;
            }
        }

        /* ===== ANIMATIONS ===== */
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js">
    </script>
    <script>
        (function() {
            'use strict';

            // ============================================================
            // CONSTANTES Y CONFIGURACIÓN
            // ============================================================
            const STORE_KEY = 'fexPharmacyData';
            const DEFAULT_COLUMN_DEFS = [
                { key: 'name', label: 'Sucursal', locked: true },
                { key: 'branchId', label: 'ID' },
                { key: 'province', label: 'Provincia' },
                { key: 'zone', label: 'Zona' },
                { key: 'server', label: 'Servidor' },
                { key: 'cc', label: 'CC' },
                { key: 'ip', label: 'IP' },
                { key: 'db', label: 'Base de Datos' },
                { key: 'backups', label: 'BackUps' },
                { key: 'externalDisk', label: 'Disco Externo' },
                { key: 'dataReduction', label: 'Reducción Datos' },
                { key: 'emailValidation', label: 'Validación Correos' },
                { key: 'ftp', label: 'FTP' },
                { key: 's3', label: 'Subir a S3' },
                { key: 'voxelLog', label: 'VoxelLogAnalyzer' },
                { key: 'failOver', label: 'FailOver' },
                { key: 'voxel', label: 'Voxel' },
                { key: 'updateBox', label: 'Actualizar Caja' },
                { key: 'bkConsecutivo', label: 'BK Consecutivo' },
                { key: 'createdAt', label: 'Fecha de Registro' },
                { key: 'status', label: 'Estado', locked: true },
            ];
            const SERVICE_KEYS = ['backups', 'externalDisk', 'dataReduction', 'emailValidation', 'ftp', 's3',
                'voxelLog', 'failOver', 'voxel', 'updateBox', 'bkConsecutivo'
            ];
            const SESSION_FILTERS_KEY = 'fexBranchFilters';
            const SQLITE_DB_FILE = 'sucursales.db';
            const SQLITE_LOCAL_BACKUP_KEY = 'fexPharmacySqliteBackup';

            // ============================================================
            // DATA MANAGER
            // ============================================================
            const DataManager = {
                db: null,
                sql: null,
                dbReady: false,
                sqliteSyncTimeout: null,

                getData() {
                    if (this.cachedData) return this.cachedData;
                    try {
                        const raw = localStorage.getItem(STORE_KEY);
                        if (raw) {
                            const data = JSON.parse(raw);
                            this.normalizeData(data);
                            this.cachedData = data;
                            return data;
                        }
                    } catch (e) { console.error('Error loading data', e); }
                    const def = this.getDefaultData();
                    this.saveData(def);
                    return def;
                },

                normalizeData(data) {
                    if (!data.zones) data.zones = [];
                    if (!data.provinces) data.provinces = [];
                    if (!data.branches) data.branches = [];
                    if (!data.customColumns) data.customColumns = [];
                    if (!data.columnSettings) data.columnSettings = {};
                    if (!data.columnSettings.order) data.columnSettings.order = DEFAULT_COLUMN_DEFS.map(c => c.key);
                    if (!data.activityLog) data.activityLog = [];
                    data.branches = data.branches.map(b => ({ custom: {}, ...b, custom: b.custom || {} }));
                    return data;
                },

                loadDataFromLocalStorage() {
                    try {
                        const raw = localStorage.getItem(STORE_KEY);
                        if (raw) {
                            const data = JSON.parse(raw);
                            this.normalizeData(data);
                            return data;
                        }
                    } catch (e) { console.error('Error loading localStorage data', e); }
                    return null;
                },

                saveData(data, opts = { persistSql: true }) {
                    this.normalizeData(data);
                    this.cachedData = data;
                    localStorage.setItem(STORE_KEY, JSON.stringify(data));
                    if (opts.persistSql) this.persistSqlite(data);
                },

                persistSqlite(data) {
                    if (!this.dbReady || !this.db) return;
                    try {
                        this.saveDataToSqlite(data);
                        this.saveSqliteBackup();
                    } catch (err) {
                        console.error('No se pudo persistir SQLite:', err);
                    }
                },

                saveSqliteBackup() {
                    if (!this.db) return;
                    try {
                        const bytes = this.db.export();
                        const base64 = this.uint8ArrayToBase64(bytes);
                        localStorage.setItem(SQLITE_LOCAL_BACKUP_KEY, base64);
                    } catch (err) {
                        console.error('No se pudo guardar backup SQLite:', err);
                    }
                },

                uint8ArrayToBase64(bytes) {
                    let binary = '';
                    const chunkSize = 0x8000;
                    for (let i = 0; i < bytes.length; i += chunkSize) {
                        binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
                    }
                    return window.btoa(binary);
                },

                base64ToUint8Array(base64) {
                    const binary = window.atob(base64);
                    const bytes = new Uint8Array(binary.length);
                    for (let i = 0; i < binary.length; i++) {
                        bytes[i] = binary.charCodeAt(i);
                    }
                    return bytes;
                },

                async initSqliteDatabase(forceReload = false) {
                    if (this.dbReady && !forceReload) return;
                    if (!window.initSqlJs) {
                        console.error('SQL.js no está disponible.');
                        return;
                    }

                    if (!this.sql) {
                        this.sql = await window.initSqlJs({
                            locateFile: () => 'https://cdnjs.cloudflare.com/ajax/libs/sql.js/1.8.0/sql-wasm.wasm'
                        });
                    }

                    let buffer = null;
                    if (!forceReload) {
                        try {
                            const response = await fetch('./' + SQLITE_DB_FILE, { cache: 'no-store' });
                            if (response.ok) {
                                buffer = await response.arrayBuffer();
                            }
                        } catch (err) {
                            console.warn('No se pudo cargar sucursales.db desde la ruta del proyecto:', err);
                        }
                    }

                    if (!buffer) {
                        const backup = localStorage.getItem(SQLITE_LOCAL_BACKUP_KEY);
                        if (backup) {
                            try {
                                buffer = this.base64ToUint8Array(backup).buffer;
                            } catch (err) {
                                console.error('Error leyendo backup SQLite local:', err);
                            }
                        }
                    }

                    try {
                        if (buffer) {
                            this.db = new this.sql.Database(new Uint8Array(buffer));
                        } else {
                            this.db = new this.sql.Database();
                        }
                    } catch (err) {
                        console.warn('No se pudo abrir la base de datos SQLite, creando una nueva:', err);
                        this.db = new this.sql.Database();
                    }

                    this.ensureSqliteSchema();
                    const dataFromDb = this.loadDataFromSqliteDb();
                    if (dataFromDb && dataFromDb.branches.length) {
                        this.saveData(dataFromDb, { persistSql: false });
                    } else {
                        const localData = this.loadDataFromLocalStorage();
                        if (localData) {
                            this.saveDataToSqlite(localData);
                            this.saveSqliteBackup();
                        } else {
                            const def = this.getDefaultData();
                            this.saveDataToSqlite(def);
                            this.saveSqliteBackup();
                            this.saveData(def, { persistSql: false });
                        }
                    }

                    this.dbReady = true;
                    if (typeof UIManager !== 'undefined' && UIManager.updateDbStatusUI) {
                        UIManager.updateDbStatusUI();
                    }
                },

                ensureSqliteSchema() {
                    const schema = [
                        `CREATE TABLE IF NOT EXISTS zones (id TEXT PRIMARY KEY, name TEXT, color TEXT);`,
                        `CREATE TABLE IF NOT EXISTS provinces (id TEXT PRIMARY KEY, name TEXT, zoneId TEXT);`,
                        `CREATE TABLE IF NOT EXISTS branches (id TEXT PRIMARY KEY, branchId TEXT, name TEXT, provinceId TEXT, server TEXT, cc TEXT, ip TEXT, db TEXT, backups TEXT, externalDisk TEXT, dataReduction TEXT, emailValidation TEXT, ftp TEXT, s3 TEXT, voxelLog TEXT, failOver TEXT, voxel TEXT, updateBox TEXT, bkConsecutivo TEXT, status TEXT, createdAt TEXT, custom TEXT);`,
                        `CREATE TABLE IF NOT EXISTS custom_columns (id TEXT PRIMARY KEY, name TEXT, defaultValue TEXT);`,
                        `CREATE TABLE IF NOT EXISTS column_settings (id INTEGER PRIMARY KEY, payload TEXT);`,
                        `CREATE TABLE IF NOT EXISTS activity_log (timestamp TEXT PRIMARY KEY, action TEXT, detail TEXT);`
                    ];
                    schema.forEach(stmt => this.db.run(stmt));
                },

                getRows(sql) {
                    const result = this.db.exec(sql);
                    if (!result || !result[0]) return [];
                    const cols = result[0].columns;
                    return result[0].values.map(row => {
                        const obj = {};
                        row.forEach((value, index) => {
                            obj[cols[index]] = value;
                        });
                        return obj;
                    });
                },

                loadDataFromSqliteDb() {
                    try {
                        const zones = this.getRows('SELECT id, name, color FROM zones;');
                        const provinces = this.getRows('SELECT id, name, zoneId FROM provinces;');
                        const branches = this.getRows('SELECT id, branchId, name, provinceId, server, cc, ip, db, backups, externalDisk, dataReduction, emailValidation, ftp, s3, voxelLog, failOver, voxel, updateBox, bkConsecutivo, status, createdAt, custom FROM branches;')
                            .map(b => ({ ...b, custom: b.custom ? JSON.parse(b.custom) : {} }));
                        const customColumns = this.getRows('SELECT id, name, defaultValue FROM custom_columns;');
                        const settingsRow = this.getRows('SELECT payload FROM column_settings LIMIT 1;')[0];
                        const columnSettings = settingsRow ? JSON.parse(settingsRow.payload) : { order: DEFAULT_COLUMN_DEFS.map(c => c.key) };
                        const activityLog = this.getRows('SELECT timestamp, action, detail FROM activity_log ORDER BY timestamp DESC;');
                        return {
                            zones,
                            provinces,
                            branches,
                            customColumns,
                            columnSettings,
                            activityLog
                        };
                    } catch (err) {
                        console.error('Error leyendo datos desde SQLite:', err);
                        return null;
                    }
                },

                saveDataToSqlite(data) {
                    if (!this.db) return;
                    this.db.run('BEGIN;');
                    this.db.run('DELETE FROM zones;');
                    const zoneStmt = this.db.prepare('INSERT INTO zones VALUES (?, ?, ?);');
                    data.zones.forEach(z => zoneStmt.run([z.id, z.name, z.color]));
                    zoneStmt.free();

                    this.db.run('DELETE FROM provinces;');
                    const provinceStmt = this.db.prepare('INSERT INTO provinces VALUES (?, ?, ?);');
                    data.provinces.forEach(p => provinceStmt.run([p.id, p.name, p.zoneId]));
                    provinceStmt.free();

                    this.db.run('DELETE FROM branches;');
                    const branchStmt = this.db.prepare(`INSERT INTO branches VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?);`);
                    data.branches.forEach(b => {
                        branchStmt.run([
                            b.id,
                            b.branchId || '',
                            b.name || '',
                            b.provinceId || '',
                            b.server || '',
                            b.cc || '',
                            b.ip || '',
                            b.db || '',
                            b.backups || '',
                            b.externalDisk || '',
                            b.dataReduction || '',
                            b.emailValidation || '',
                            b.ftp || '',
                            b.s3 || '',
                            b.voxelLog || '',
                            b.failOver || '',
                            b.voxel || '',
                            b.updateBox || '',
                            b.bkConsecutivo || '',
                            b.status || '',
                            b.createdAt || '',
                            JSON.stringify(b.custom || {})
                        ]);
                    });
                    branchStmt.free();

                    this.db.run('DELETE FROM custom_columns;');
                    const colStmt = this.db.prepare('INSERT INTO custom_columns VALUES (?, ?, ?);');
                    data.customColumns.forEach(c => colStmt.run([c.id, c.name, c.defaultValue || '']));
                    colStmt.free();

                    this.db.run('DELETE FROM column_settings;');
                    const settingsStmt = this.db.prepare('INSERT INTO column_settings VALUES (?, ?);');
                    settingsStmt.run([1, JSON.stringify(data.columnSettings || { order: DEFAULT_COLUMN_DEFS.map(c => c.key) })]);
                    settingsStmt.free();

                    this.db.run('DELETE FROM activity_log;');
                    const auditStmt = this.db.prepare('INSERT INTO activity_log VALUES (?, ?, ?);');
                    (data.activityLog || []).forEach(log => auditStmt.run([log.timestamp, log.action, log.detail]));
                    auditStmt.free();
                    this.db.run('COMMIT;');
                },

                exportSqliteDatabase() {
                    if (!this.db) return null;
                    return this.db.export();
                },

                importSqliteDatabase(buffer) {
                    try {
                        this.db = new this.sql.Database(new Uint8Array(buffer));
                        this.ensureSqliteSchema();
                        const dataFromDb = this.loadDataFromSqliteDb();
                        if (dataFromDb) {
                            this.saveData(dataFromDb, { persistSql: false });
                            this.saveSqliteBackup();
                            this.dbReady = true;
                            if (typeof UIManager !== 'undefined' && UIManager.updateDbStatusUI) {
                                UIManager.updateDbStatusUI();
                            }
                            return true;
                        }
                    } catch (err) {
                        console.error('Error importando base SQLite:', err);
                    }
                    return false;
                },

                // ============================================================
                // COLUMN SETTINGS
                // ============================================================
                getColumnSettings(data) {
                    const saved = data.columnSettings || {};
                    const merged = {};
                    DEFAULT_COLUMN_DEFS.forEach(col => {
                        merged[col.key] = {
                            label: (saved[col.key] && saved[col.key].label) ? saved[col.key].label : col.label,
                            visible: saved[col.key] && typeof saved[col.key].visible === 'boolean' ? saved[col.key]
                                .visible : true,
                            locked: !!col.locked
                        };
                    });
                    return merged;
                },

                isColVisible(colSettings, key) {
                    return !colSettings[key] || colSettings[key].visible !== false;
                },

                getOrderedColumns(data) {
                    const colSettings = this.getColumnSettings(data);
                    const order = data.columnSettings?.order || DEFAULT_COLUMN_DEFS.map(c => c.key);
                    const defMap = {};
                    DEFAULT_COLUMN_DEFS.forEach(c => defMap[c.key] = c);
                    const ordered = [];
                    order.forEach(key => {
                        if (defMap[key]) ordered.push(defMap[key]);
                    });
                    // agregar los que falten
                    DEFAULT_COLUMN_DEFS.forEach(c => {
                        if (!ordered.find(o => o.key === c.key)) ordered.push(c);
                    });
                    return ordered;
                },

                // ============================================================
                generateId() {
                    return 'id_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);

                getZoneById(id, data) {
                    return data.zones.find(z => z.id === id);
                },

                getProvinceById(id, data) {
                    return data.provinces.find(p => p.id === id);
                },

                getZoneByProvinceId(provinceId, data) {
                    const prov = this.getProvinceById(provinceId, data);
                    if (!prov) return null;
                    return this.getZoneById(prov.zoneId, data);
                },

                getProvinceName(id, data) {
                    const p = this.getProvinceById(id, data);
                    return p ? p.name : 'Sin provincia';
                },

                getZoneName(id, data) {
                    const z = this.getZoneById(id, data);
                    return z ? z.name : 'Sin zona';
                },

                getBranchesByProvince(provinceId, data) {
                    return data.branches.filter(b => b.provinceId === provinceId);
                },

                getBranchesByZone(zoneId, data) {
                    const provs = data.provinces.filter(p => p.zoneId === zoneId).map(p => p.id);
                    return data.branches.filter(b => provs.includes(b.provinceId));
                },

                formatDate(iso) {
                    if (!iso) return '—';
                    const d = new Date(iso);
                    if (isNaN(d.getTime())) return '—';
                    return d.toLocaleDateString('es', { year: 'numeric', month: '2-digit', day: '2-digit' });
                },

                getStatusBadge(status) {
                    if (status === 'closed') return '<span class="badge-status closed">Cerrada</span>';
                    return '<span class="badge-status active">Activa</span>';
                },

                getValueBadge(val) {
                    if (!val || val === '') return '<span class="badge-status na">—</span>';
                    const v = val.toUpperCase();
                    if (v === 'SI') return '<span class="badge-status si">SI</span>';
                    if (v === 'NO') return '<span class="badge-status no">NO</span>';
                    if (v === 'NA') return '<span class="badge-status na">NA</span>';
                    if (v === 'SOLICITADO') return '<span class="badge-status solicitado">Solicitado</span>';
                    return `<span class="badge bg-light text-dark">${val}</span>`;
                },

                getZoneColorBadge(zoneId, data) {
                    const z = this.getZoneById(zoneId, data);
                    if (!z) return '<span class="zone-badge" style="background:#999;">Sin zona</span>';
                    return `<span class="zone-badge" style="background:${z.color};">${z.name}</span>`;
                },

                getBranchCellHtml(b, key, data) {
                    switch (key) {
                        case 'name': return `<strong>${b.name || ''}</strong>`;
                        case 'branchId': return b.branchId || '—';
                        case 'province': return this.getProvinceName(b.provinceId, data);
                        case 'zone': {
                            const z = this.getZoneByProvinceId(b.provinceId, data);
                            return z ? `<span class="zone-badge" style="background:${z.color};">${z.name}</span>` :
                                'Sin zona';
                        }
                        case 'server': return b.server || '—';
                        case 'cc': return b.cc || '—';
                        case 'ip': return b.ip || '—';
                        case 'db': return `<span class="col-db" title="${b.db || ''}">${b.db || '—'}</span>`;
                        case 'createdAt': return this.formatDate(b.createdAt);
                        case 'status': return this.getStatusBadge(b.status);
                        default:
                            if (SERVICE_KEYS.includes(key)) return this.getValueBadge(b[key] || '');
                            return b[key] || '—';
                    }
                },

                    switch (key) {
                        case 'name': return b.name || '';
                        case 'branchId': return b.branchId || '';
                        case 'province': return this.getProvinceName(b.provinceId, data);
                        case 'zone': {
                            const z = this.getZoneByProvinceId(b.provinceId, data);
                            return z ? z.name : 'Sin zona';
                        }
                        case 'server': return b.server || '';
                        case 'cc': return b.cc || '';
                        case 'ip': return b.ip || '';
                        case 'db': return b.db || '';
                        case 'createdAt': return this.formatDate(b.createdAt);
                        case 'status': return b.status === 'active' ? 'Activa' : 'Cerrada';

                            if (valA < valB) return sortDir === 'asc' ? -1 : 1;

                // ============================================================

                // ============================================================
                renderSettings() {

                renderDefaultColumnsSettings() {
                    const data = DataManager.getData();
                    const colSettings = DataManager.getColumnSettings(data);
                    const ordered = DataManager.getOrderedColumns(data);
                    const tbody = document.getElementById('defaultColumnsBody');
                    tbody.innerHTML = ordered.map((c, idx) => {
                        const cfg = colSettings[c.key];
                        const disabled = c.locked ? 'disabled' : '';
                        return `<tr draggable="true" data-colkey="${c.key}" data-index="${idx}" class="drag-row">
                            <td><span class="drag-handle"><i class="fas fa-grip-lines"></i></span></td>
                            <td>
                                <input type="checkbox" class="form-check-input" data-colkey="${c.key}" data-role="visible"
                                    ${cfg.visible ? 'checked' : ''} ${disabled}>
                            </td>
                            <td>
                                <input type="text" class="form-control form-control-sm" data-colkey="${c.key}" data-role="label"
                                    value="${cfg.label}" placeholder="${c.label}">
                            </td>
                        </tr>`;
                    }).join('');

                    // Drag & Drop
                    let dragSrcIndex = null;
                    tbody.querySelectorAll('.drag-row').forEach(row => {
                        row.addEventListener('dragstart', function(e) {
                            dragSrcIndex = parseInt(this.dataset.index);
                            this.classList.add('dragging');
                            e.dataTransfer.effectAllowed = 'move';
                            e.dataTransfer.setData('text/plain', this.dataset.colkey);
                        });
                        row.addEventListener('dragend', function() {
                            this.classList.remove('dragging');
                            document.querySelectorAll('.drag-row').forEach(r => r.classList.remove('drag-over'));
                        });
                        row.addEventListener('dragover', function(e) {
                            e.preventDefault();
                            e.dataTransfer.dropEffect = 'move';
                            document.querySelectorAll('.drag-row').forEach(r => r.classList.remove('drag-over'));
                            this.classList.add('drag-over');
                        });
                        row.addEventListener('dragleave', function() {
                            this.classList.remove('drag-over');
                        });
                        row.addEventListener('drop', function(e) {
                            e.preventDefault();
                            this.classList.remove('drag-over');
                            const srcKey = e.dataTransfer.getData('text/plain');
                            const targetKey = this.dataset.colkey;
                            if (srcKey === targetKey) return;
                            const data = DataManager.getData();
                            const order = data.columnSettings.order || DEFAULT_COLUMN_DEFS.map(c => c.key);
                            const srcIdx = order.indexOf(srcKey);
                            const tgtIdx = order.indexOf(targetKey);
                            if (srcIdx === -1 || tgtIdx === -1) return;
                            order.splice(srcIdx, 1);
                            order.splice(tgtIdx, 0, srcKey);
                            data.columnSettings.order = order;
                            DataManager.saveData(data);
                            UIManager.renderDefaultColumnsSettings();
                            UIManager.renderBranches();
                            UIManager.showNotification('Orden actualizado', 'El orden de columnas se ha modificado.',
                                'success');
                        });
                    });
                },

                renderCustomColumns() {
                    const data = DataManager.getData();
                    const tbody = document.getElementById('customColumnsBody');
                    if (!data.customColumns || data.customColumns.length === 0) {
                        tbody.innerHTML =

                        return;
                    }
                    tbody.innerHTML = data.customColumns.map(c => `

                // ============================================================
                // REPORTS
                // ============================================================
                renderReports() {
                    const now = new Date();
                    const monthInput = document.getElementById('reportMonth');
                    if (!monthInput.value) {
                        monthInput.value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
                    }
                    this.generateReportTable();
                },

                generateReportTable() {
                    const data = DataManager.getData();
                    const monthVal = document.getElementById('reportMonth').value;
                    if (!monthVal) return;

                    const [year, month] = monthVal.split('-').map(Number);
                    const monthName = new Date(year, month - 1).toLocaleString('es', { month: 'long' });
                    const monthEnd = new Date(year, month, 0, 23, 59, 59);

                    const customCols = data.customColumns || [];
                    const colSettings = DataManager.getColumnSettings(data);
                    const ordered = DataManager.getOrderedColumns(data);
                    const visibleCols = ordered.filter(c => DataManager.isColVisible(colSettings, c.key));

                    const branchesForReport = data.branches.filter(b => !b.createdAt || new Date(b.createdAt) <= monthEnd);
                    const newThisMonth = data.branches.filter(b => {
                        if (!b.createdAt) return false;
                        const d = new Date(b.createdAt);
                        return d.getFullYear() === year && (d.getMonth() + 1) === month;
                    }).length;

                    let headHtml = `<th>#</th>`;
                    visibleCols.forEach(c => { headHtml += `<th>${colSettings[c.key].label}</th>`; });
                    customCols.forEach(c => { headHtml += `<th>${c.name}</th>`; });
                    document.getElementById('reportHead').innerHTML = headHtml;

                    const tbody = document.getElementById('reportBody');
                    if (branchesForReport.length === 0) {
                        tbody.innerHTML =
                            `<tr><td colspan="100" class="text-center py-4 text-muted">No hay datos para generar el reporte.</td></tr>`;
                        document.getElementById('reportSummary').innerHTML = `<p class="text-muted">No hay datos.</p>`;
                        return;
                    }

                    let html = '';
                    branchesForReport.forEach((b, idx) => {
                        html += `<tr><td>${idx + 1}</td>`;
                        visibleCols.forEach(c => {
                            html += `<td>${DataManager.getBranchCellHtml(b, c.key, data)}</td>`;
                        });
                        customCols.forEach(c => {
                            const val = (b.custom && b.custom[c.id]) || c.defaultValue || '';
                            html += `<td>${val || '—'}</td>`;
                        });
                        html += `</tr>`;
                    });
                    tbody.innerHTML = html;

                    const active = branchesForReport.filter(b => b.status === 'active').length;
                    const closed = branchesForReport.filter(b => b.status === 'closed').length;
                    document.getElementById('reportSummary').innerHTML = `
                        <div class="mb-2"><strong>${monthName} ${year}</strong></div>
                        <div class="d-flex justify-content-between"><span>Total sucursales (a esa fecha):</span> <strong>${branchesForReport.length}</strong></div>
                        <div class="d-flex justify-content-between"><span>Registradas en el mes:</span> <strong>${newThisMonth}</strong></div>
                        <div class="d-flex justify-content-between"><span>Activas:</span> <strong class="text-success">${active}</strong></div>
                        <div class="d-flex justify-content-between"><span>Cerradas:</span> <strong class="text-danger">${closed}</strong></div>
                        <hr>
                        <div class="d-flex justify-content-between"><span>Zonas:</span> <strong>${data.zones.length}</strong></div>
                        <div class="d-flex justify-content-between"><span>Provincias:</span> <strong>${data.provinces.length}</strong></div>
                    `;
                },

                // ============================================================
                // SERVICE ALERT
                // ============================================================
                renderServiceAlert() {
                    const data = DataManager.getData();
                    const fields = ['backups', 'externalDisk', 'dataReduction', 'emailValidation', 'ftp', 's3', 'voxelLog',
                        'failOver', 'voxel', 'updateBox', 'bkConsecutivo'
                    ];
                    const fieldLabels = {
                        backups: 'BackUps',
                        externalDisk: 'Disco Externo',
                        dataReduction: 'Reducción Datos',
                        emailValidation: 'Validación Correos',
                        ftp: 'FTP',
                        s3: 'Subir a S3',
                        voxelLog: 'VoxelLogAnalyzer',
                        failOver: 'FailOver',
                        voxel: 'Voxel',
                        updateBox: 'Actualizar Caja',
                        bkConsecutivo: 'BK Consecutivo'
                    };

                    let incomplete = [];
                    data.branches.forEach(b => {
                        const missing = [];
                        fields.forEach(f => {
                            const val = (b[f] || '').toUpperCase();
                            if (val !== 'SI' && val !== '') {
                                missing.push(fieldLabels[f]);
                            }
                        });
                        if (missing.length > 0) {
                            incomplete.push({ name: b.name, missing: missing });
                        }
                    });

                    const alertEl = document.getElementById('serviceAlert');
                    const textEl = document.getElementById('serviceAlertText');

                    if (incomplete.length === 0) {
                        alertEl.classList.add('d-none');
                        return;
                    }

                    alertEl.classList.remove('d-none');
                    let msg = `<strong>⚠️ ${incomplete.length} sucursal(es) tienen servicios incompletos:</strong> `;
                    const items = incomplete.map(item =>
                        `<span class="badge bg-warning text-dark me-1">${item.name}</span> (falta: ${item.missing.join(', ')})`
                    );
                    msg += items.join('; ');
                    textEl.innerHTML = msg;
                },

                    const toast = document.getElementById('notificationToast');
                    const icon = document.getElementById('toastIcon');
                    const titleEl = document.getElementById('notifTitle');
                    const bodyEl = document.getElementById('notifBody');

                    toast.className = 'notification-toast';
                    if (type === 'success') {
                        toast.classList.add('toast-success');
                        icon.className = 'stat-icon-green';
                        icon.innerHTML = '<i class="fas fa-check-circle"></i>';
                    } else if (type === 'error') {
                        toast.classList.add('toast-error');
                        icon.className = 'stat-icon-red';
                        icon.innerHTML = '<i class="fas fa-exclamation-circle"></i>';
                    } else if (type === 'warning') {
                        toast.classList.add('toast-warning');
                        icon.className = 'stat-icon-orange';
                        icon.innerHTML = '<i class="fas fa-exclamation-triangle"></i>';
                    } else {
                        toast.classList.add('toast-info');
                        icon.className = 'stat-icon-indigo';
                        icon.innerHTML = '<i class="fas fa-info"></i>';
                    }

                    titleEl.textContent = title;
                    bodyEl.textContent = body;
                    toast.classList.add('show');

                    if (window.notifTimeout) clearTimeout(window.notifTimeout);
                    window.notifTimeout = setTimeout(() => {
                        toast.classList.remove('show');
                    }, 5000);

                // ============================================================
                applyServicesToAll() {
                    if (!confirm('¿Aplicar la configuración de servicios de esta sucursal a todas las demás?')) return;
                    const data = DataManager.getData();
                    const id = document.getElementById('editBranchId').value;
                    const source = data.branches.find(b => b.id === id);
                    if (!source) {
                        UIManager.showNotification('Error', 'No se encontró la sucursal origen.', 'error');
                        return;
                    }
                    const serviceKeys = ['backups', 'externalDisk', 'dataReduction', 'emailValidation', 'ftp', 's3',
                        'voxelLog', 'failOver', 'voxel', 'updateBox', 'bkConsecutivo'
                    ];
                    data.branches.forEach(b => {
                        serviceKeys.forEach(k => { b[k] = source[k]; });
                    });
                    DataManager.saveData(data);
                    UIManager.showNotification('Servicios aplicados', 'La configuración se copió a todas las sucursales.',

                    UIManager.renderBranches();

                    if (!name) {
                        UIManager.showNotification('Error', 'El nombre de la sucursal es obligatorio.', 'error');

                    const provinceId = document.getElementById('fBranchProvince').value;
                    if (!provinceId) {
                        UIManager.showNotification('Error', 'Seleccione una provincia.', 'error');
                        return;
                    }

                    const branchIdVal = document.getElementById('fBranchId').value.trim();
                    const ccVal = document.getElementById('fBranchCC').value.trim();

                    if (branchIdVal) {
                        const dupId = data.branches.find(b => b.id !== id &&
                            (b.branchId || '').toString().trim().toLowerCase() === branchIdVal.toLowerCase());
                        if (dupId) {
                            UIManager.showNotification('Error', `Ya existe una sucursal con el ID "${branchIdVal}" (${dupId.name}).`,
                                'error');
                            return;
                        }
                    }
                    if (ccVal) {
                        const dupCC = data.branches.find(b => b.id !== id &&
                            (b.cc || '').toString().trim().toLowerCase() === ccVal.toLowerCase());
                        if (dupCC) {
                            UIManager.showNotification('Error', `Ya existe una sucursal con el CC "${ccVal}" (${dupCC.name}).`,
                                'error');
                            return;

                    }

                    const branchData = {
                        name: name,
                        branchId: document.getElementById('fBranchId').value.trim(),

                        cc: document.getElementById('fBranchCC').value.trim(),

                    customCols.forEach(c => {

            const ReportManager = {
                generatePDF() {
                    UIManager.showSpinner('Generando PDF...');
                    setTimeout(() => {
                        try {
                            const data = DataManager.getData();
                            const monthVal = document.getElementById('reportMonth').value;
                            if (!monthVal) { UIManager.hideSpinner(); return; }
                            const [year, month] = monthVal.split('-').map(Number);
                            const monthName = new Date(year, month - 1).toLocaleString('es', { month: 'long' });

                            const { jsPDF } = window.jspdf;
                            const doc = new jsPDF('landscape', 'mm', 'a4');

                            doc.setFontSize(16);
                            doc.text(`Reporte de Sucursales - ${monthName} ${year}`, 14, 18);
                            doc.setFontSize(10);
                            doc.text(`Generado: ${new Date().toLocaleString('es')}`, 14, 25);

                            const customCols = data.customColumns || [];
                            const colSettings = DataManager.getColumnSettings(data);
                            const ordered = DataManager.getOrderedColumns(data);
                            const visibleCols = ordered.filter(c => DataManager.isColVisible(colSettings, c.key));
                            const monthEnd = new Date(year, month, 0, 23, 59, 59);
                            const branchesForReport = data.branches.filter(b => !b.createdAt || new Date(b.createdAt) <=
                                monthEnd);

                            const headers = ['#'];
                            visibleCols.forEach(c => headers.push(colSettings[c.key].label));
                            customCols.forEach(c => headers.push(c.name));

                            const rows = branchesForReport.map((b, idx) => {
                                const row = [idx + 1];
                                visibleCols.forEach(c => row.push(DataManager.getBranchCellText(b, c.key, data)));
                                customCols.forEach(c => row.push((b.custom && b.custom[c.id]) || c.defaultValue ||
                                ''));
                                return row;
                            });

                            doc.autoTable({
                                head: [headers],
                                body: rows,
                                startY: 32,
                                styles: { fontSize: 7, cellPadding: 1.5 },
                                headStyles: { fillColor: [26, 35, 126], fontSize: 7, halign: 'center' },
                                columnStyles: { 0: { halign: 'center' }, 2: { halign: 'center' } },
                                didDrawPage: function(data) {
                                    doc.setFontSize(8);
                                    doc.text(`Página ${data.pageNumber}`, doc.internal.pageSize.width - 20, doc
                                        .internal.pageSize.height - 6);
                                }
                            });

                            doc.save(`Reporte_Sucursales_${year}_${String(month).padStart(2, '0')}.pdf`);
                            UIManager.showNotification('PDF generado', 'El reporte en PDF se ha descargado.', 'success');
                        } catch (e) {
                            UIManager.showNotification('Error', 'No se pudo generar el PDF.', 'error');
                            console.error(e);
                        }
                        UIManager.hideSpinner();
                    }, 300);
                },

                generateExcel() {
                    UIManager.showSpinner('Generando Excel...');
                    setTimeout(() => {
                        try {
                            const data = DataManager.getData();
                            const monthVal = document.getElementById('reportMonth').value;
                            if (!monthVal) { UIManager.hideSpinner(); return; }
                            const [year, month] = monthVal.split('-').map(Number);
                            const monthName = new Date(year, month - 1).toLocaleString('es', { month: 'long' });

                            const customCols = data.customColumns || [];
                            const colSettings = DataManager.getColumnSettings(data);
                            const ordered = DataManager.getOrderedColumns(data);
                            const visibleCols = ordered.filter(c => DataManager.isColVisible(colSettings, c.key));
                            const monthEnd = new Date(year, month, 0, 23, 59, 59);
                            const branchesForReport = data.branches.filter(b => !b.createdAt || new Date(b.createdAt) <=
                                monthEnd);

                            const headers = ['#'];
                            visibleCols.forEach(c => headers.push(colSettings[c.key].label));
                            customCols.forEach(c => headers.push(c.name));

                            const rows = branchesForReport.map((b, idx) => {
                                const row = [idx + 1];
                                visibleCols.forEach(c => row.push(DataManager.getBranchCellText(b, c.key, data)));
                                customCols.forEach(c => row.push((b.custom && b.custom[c.id]) || c.defaultValue ||
                                ''));
                                return row;
                            });

                            const wb = XLSX.utils.book_new();
                            const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);

                            const colWidths = headers.map((h, i) => {
                                let maxLen = h.length;
                                rows.forEach(r => { if (r[i] && r[i].toString().length > maxLen) maxLen = r[i]
                                        .toString().length; });
                                return { wch: Math.min(Math.max(maxLen + 2, 10), 30) };
                            });
                            ws['!cols'] = colWidths;

                            XLSX.utils.book_append_sheet(wb, ws, 'Sucursales');
                            XLSX.writeFile(wb,
                                `Reporte_Sucursales_${year}_${String(month).padStart(2, '0')}.xlsx`);
                            UIManager.showNotification('Excel generado', 'El reporte en Excel se ha descargado.',
                                'success');
                        } catch (e) {
                            UIManager.showNotification('Error', 'No se pudo generar el Excel.', 'error');
                            console.error(e);
                        }
                        UIManager.hideSpinner();
                    }, 300);
