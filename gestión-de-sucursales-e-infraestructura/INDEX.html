                if (!file) return;
                const reader = new FileReader();
                reader.onload = function(e) {
                    try {
                        const data = JSON.parse(e.target.result);
                        if (!data.zones || !data.provinces || !data.branches) {
                            UIManager.showNotification('Error', 'El archivo no tiene el formato correcto.', 'error');
                            return;
                        }
                        if (!confirm('Esto reemplazará todos los datos actuales. ¿Continuar?')) return;
                        DataManager.saveData(data);
                        UIManager.renderAll();
                        UIManager.showNotification('Importación', 'Datos importados correctamente.', 'success');
                    } catch (err) {
                        UIManager.showNotification('Error', 'No se pudo leer el archivo.', 'error');
                    }
                };
                reader.readAsText(file);
                event.target.value = '';
            };

            // Email test
            window.sendTestEmail = function() {
                const email = document.getElementById('emailRecipient').value.trim();
                if (!email || !email.includes('@')) {
                    UIManager.showNotification('Error', 'Ingrese un correo electrónico válido.', 'error');
                    return;
                }
                const subject = encodeURIComponent('Prueba - Sistema de Gestión FEX Pharmacy');
                const body = encodeURIComponent(
                    `Este es un correo de prueba del sistema de gestión de sucursales.\n\n` +
                    `Total de sucursales: ${DataManager.getData().branches.length}\n` +
                    `Zonas: ${DataManager.getData().zones.length}\n` +
                    `Provincias: ${DataManager.getData().provinces.length}\n\n` +
                    `Generado automáticamente el ${new Date().toLocaleString('es')}`
                );
                window.open(`mailto:${email}?subject=${subject}&body=${body}`);
                UIManager.showNotification('Correo', `Se abrirá su cliente de correo para enviar a ${email}`, 'info');
            };

            // SQLite DB handlers
            window.reloadSqliteDatabase = async function() {
                await DataManager.reloadSqliteDatabase();
                DataManager.getData();
                UIManager.renderAll();
                UIManager.showNotification('DB recargada', 'Base de datos SQLite recargada correctamente.', 'success');
            };

            window.exportSqliteDb = function() {
                const bytes = DataManager.exportSqliteDatabase();
                if (!bytes) {
                    UIManager.showNotification('Error', 'No hay base de datos SQLite disponible para exportar.', 'error');
                    return;
                }
                const blob = new Blob([bytes], { type: 'application/octet-stream' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = SQLITE_DB_FILE;
                a.click();
                URL.revokeObjectURL(url);
                UIManager.showNotification('DB exportada', 'La base de datos SQLite se ha descargado.', 'success');
            };

            window.importSqliteDb = async function(event) {
                const file = event.target.files[0];
                if (!file) return;
                try {
                    const buffer = await file.arrayBuffer();
                    const ok = DataManager.importSqliteDatabase(buffer);
                    if (ok) {
                        UIManager.renderAll();
                        UIManager.showNotification('DB importada', 'La base de datos SQLite se cargó correctamente.', 'success');
                    } else {
                        UIManager.showNotification('Error', 'No se pudo importar la base de datos SQLite.', 'error');
                    }
                } catch (err) {
                    console.error(err);
                    UIManager.showNotification('Error', 'No se pudo leer el archivo de base de datos.', 'error');
                }
                event.target.value = '';
            };

            // Audit
            window.clearAuditLog = function() {
                if (!confirm('¿Eliminar todo el registro de actividad?')) return;
                const data = DataManager.getData();
                data.activityLog = [];
                DataManager.saveData(data);
                UIManager.renderAudit();
                UIManager.showNotification('Registro limpiado', 'El registro de actividad ha sido vaciado.', 'success');
            };

            // ============================================================
            // EVENT LISTENERS
            // ============================================================
            document.addEventListener('DOMContentLoaded', async function() {
                // Inicializar tema
                ThemeManager.init();

                // Inicializar SQLite y cargar datos
                await DataManager.initSqliteDatabase();
                DataManager.getData();
                UIManager.renderAll();

                // Filtros con debounce
                const debounce = (fn, delay) => {
                    let timer;
                    return function(...args) {
                        clearTimeout(timer);
                        timer = setTimeout(() => fn.apply(this, args), delay);
                    };
                };
                const saveFiltersAndRender = () => {
                    const filters = {
                        search: document.getElementById('branchSearch').value,
                        zone: document.getElementById('filterZone').value,
                        province: document.getElementById('filterProvince').value,
                        status: document.getElementById('filterStatus').value,
                        sortKey: UIManager.getFilters().sortKey || '',
                        sortDir: UIManager.getFilters().sortDir || 'asc',
                    };
                    UIManager.saveFilters(filters);
                    UIManager.renderBranches();
                };
                const debouncedSave = debounce(saveFiltersAndRender, 300);
                document.getElementById('branchSearch').addEventListener('input', debouncedSave);
                document.getElementById('filterZone').addEventListener('change', saveFiltersAndRender);
                document.getElementById('filterProvince').addEventListener('change', saveFiltersAndRender);
                document.getElementById('filterStatus').addEventListener('change', saveFiltersAndRender);

                // Report month change
                document.getElementById('reportMonth').addEventListener('change', function() {
                    UIManager.generateReportTable();
                });

                // Sidebar navigation
                document.querySelectorAll('.sidebar-menu .nav-item').forEach(item => {
                    item.addEventListener('click', function() {
                        const tab = this.dataset.tab;
                        document.querySelectorAll('.sidebar-menu .nav-item').forEach(el => el.classList
                            .remove('active'));
                        this.classList.add('active');

                        document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
                        const target = document.getElementById(`tab-${tab}`);
                        if (target) target.classList.add('active');

                        const titles = {
                            dashboard: { title: 'Dashboard', sub: 'Vista general del sistema' },
                            branches: { title: 'Sucursales', sub: 'Gestión y listado de sucursales' },
                            zones: { title: 'Zonas y Provincias', sub: 'Organización regional' },
                            reports: { title: 'Reportes', sub: 'Generación de reportes mensuales' },
                            settings: { title: 'Configuración', sub: 'Columnas personalizadas y ajustes' },
                            audit: { title: 'Auditoría', sub: 'Registro de actividad del sistema' },
                            help: { title: 'Ayuda', sub: 'Guía rápida del sistema' },
                        };
                        const info = titles[tab] || { title: tab, sub: '' };
                        document.getElementById('pageTitle').textContent = info.title;
                        document.getElementById('pageSubtitle').textContent = info.sub;

                        document.getElementById('sidebar').classList.remove('open');

                        // Si es auditoría, renderizar
                        if (tab === 'audit') UIManager.renderAudit();
                        if (tab === 'reports') UIManager.renderReports();
                    });
                });

                // Mobile toggle
                document.getElementById('mobileToggle').addEventListener('click', function() {
                    document.getElementById('sidebar').classList.toggle('open');
                });

                document.addEventListener('click', function(e) {
                    const sidebar = document.getElementById('sidebar');
                    const toggle = document.getElementById('mobileToggle');
                    if (window.innerWidth <= 992) {
                        if (!sidebar.contains(e.target) && !toggle.contains(e.target)) {
                            sidebar.classList.remove('open');
                        }
                    }
                });

                // Theme toggle
                document.getElementById('themeToggle').addEventListener('click', ThemeManager.toggle);

                // Province change -> update zone
                document.getElementById('fBranchProvince').addEventListener('change', UIManager.updateZoneFromProvince);

                // Color picker
                document.querySelectorAll('#zoneColorPicker .color-option').forEach(el => {
                    el.addEventListener('click', function() {
                        document.querySelectorAll('#zoneColorPicker .color-option').forEach(o => o
                            .classList.remove('selected'));
                        this.classList.add('selected');
                        document.getElementById('fZoneColor').value = this.dataset.color;
                    });
                });

                // Notification button
                document.getElementById('notifBtn').addEventListener('click', function() {
                    UIManager.showNotification('Sistema', 'Todas las operaciones están funcionando correctamente.',
                        'info');
                    document.getElementById('notifDot').style.display = 'none';
                });

                // Inicializar mes en reportes
                const now = new Date();
                const monthInput = document.getElementById('reportMonth');
                if (!monthInput.value) {
                    monthInput.value = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}`;
                }

                UIManager.showNotification('Bienvenido', `${DataManager.getData().branches.length} sucursales cargadas.`,
                    'info');
            });

            // ============================================================
            // FIN DEL IIFE
            // ============================================================
        })();
    </script>
</body>
</html>
